name: solo55-reeltone
services:
  bench:
    build:
      context: .
      args:
        REELTONE_DEPENDENCY_IMAGE: ${REELTONE_DEPENDENCY_IMAGE:-python:3.11-slim}
    image: ${REELTONE_IMAGE:-solo55-reeltone:1.0}
    init: true
    network_mode: bridge
    ports:
      - "127.0.0.1:${REELTONE_PORT:-19955}:8000"
    volumes:
      - archive-library:/var/lib/reeltone
    environment:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  archive-library:
